<header>
  <div class="head-inner">
    <p class="eyebrow">wirefold · go network</p>
    <h1>Concurrency map — mutex pattern 3 · shared service</h1>
    <nav class="crumbnav"><a href="mutex-patterns.html">&larr; mutex patterns</a></nav>
  </div>
</header>

<div class="wrap">
<section class="panel" id="p-mutex-3" data-active>

  <div class="plate">
    <svg viewBox="0 356 860 302" role="img" aria-label="Shared service: neither the clock nor the trace is a shared lock anymore. RealClock.mu is deleted -- every goroutine now holds its own RealClock value-copy, speed changes travel on per-goroutine buffered-1 latest-wins channels. Trace is a passive object, not a goroutine; roughly 18 goroutines emit to it on a channel and one drain goroutine is the sole writer, no lock.">
      <text class="d-tl" x="0" y="360">3 · SHARED SERVICE — neither is a shared lock anymore</text>
      <rect class="d-group" x="0" y="370" width="860" height="282" rx="6"/>

      <text class="d-tl" x="20" y="392">NO LONGER SHARED — the clock</text>
      <rect class="d-box-passive" x="20" y="402" width="390" height="196" rx="5"/>
      <text class="d-t"  x="34" y="428">RealClock</text>
      <text class="d-ts" x="34" y="448">deleted: RealClock.mu, the one shared</text>
      <text class="d-ts" x="34" y="464">clock object, and the shared Tick() bus</text>
      <text class="d-ts" x="34" y="480">a goroutine could contend on</text>
      <text class="d-ts" x="34" y="506">now: every goroutine holds its OWN</text>
      <text class="d-ts" x="34" y="522">RealClock value-copy — nothing to lock</text>
      <text class="d-ts" x="34" y="548">speed changes travel on per-goroutine</text>
      <text class="d-ts" x="34" y="564">buffered-1 latest-wins channels, not a bus</text>
      <text class="d-ts" x="34" y="588">see “the clock question” tab</text>

      <text class="d-tl" x="450" y="392">SHARED STATE, NO LOCK — says “what happened”</text>
      <rect class="d-box-passive" x="450" y="402" width="140" height="196" rx="5"/>
      <text class="d-t"  x="464" y="426">Trace</text>
      <text class="d-ts" x="464" y="444">passive object —</text>
      <text class="d-ts" x="464" y="462">NOT a goroutine</text>
      <text class="d-ts" x="464" y="486">the drain below</text>
      <text class="d-ts" x="464" y="500">is the goroutine</text>
      <text class="d-ts" x="464" y="574">mu deleted</text>

      <line class="d-arrow-flow" x1="590" y1="428" x2="634" y2="428"/>
      <path class="d-arrow-flow" d="M598 424 L588 428 L598 432"/>
      <rect class="d-box-flow" x="644" y="402" width="204" height="38" rx="4" opacity=".35"/>
      <rect class="d-box-flow" x="640" y="406" width="204" height="38" rx="4" opacity=".6"/>
      <rect class="d-box-flow" x="636" y="410" width="204" height="38" rx="4"/>
      <text class="d-t"  x="648" y="427">node's own loop</text>
      <text class="d-ts" x="648" y="441">× 9  —  Fire · Send · Arrive</text>

      <line class="d-arrow-flow" x1="590" y1="486" x2="634" y2="486"/>
      <path class="d-arrow-flow" d="M598 482 L588 486 L598 490"/>
      <rect class="d-box-flow" x="644" y="460" width="204" height="38" rx="4" opacity=".35"/>
      <rect class="d-box-flow" x="640" y="464" width="204" height="38" rx="4" opacity=".6"/>
      <rect class="d-box-flow" x="636" y="468" width="204" height="38" rx="4"/>
      <text class="d-t"  x="648" y="485">nodeMover</text>
      <text class="d-ts" x="648" y="499">× 9  —  NodeGeometry</text>

      <line class="d-arrow-flow" x1="590" y1="544" x2="634" y2="544"/>
      <path class="d-arrow-flow" d="M626 540 L636 544 L626 548"/>
      <rect class="d-box-flow" x="636" y="526" width="204" height="38" rx="4"/>
      <text class="d-t"  x="648" y="543">drain — the ONLY writer, no lock</text>
      <text class="d-ts" x="648" y="557">one · reads it back, packs buffer → editor</text>

      <text class="d-ts" x="450" y="614">≈18 goroutines emit to it on a channel · 1 drains it</text>
      <rect class="d-box-flow" x="20" y="630" width="16" height="11" rx="2"/>
      <text class="d-ts" x="44" y="640">goroutine — one per node / per output</text>
      <rect class="d-box-passive" x="330" y="630" width="16" height="11" rx="2"/>
      <text class="d-ts" x="354" y="640">passive object — nothing runs in it, no lock</text>
    </svg>
    <p class="plate-cap">verified by removing each guard and running go test -race</p>
  </div>

</section>
</div>
