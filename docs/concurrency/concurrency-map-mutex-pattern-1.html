<div class="wrap">
<section class="panel" id="p-mutex-1" data-active>

  <div class="plate">
    <svg viewBox="0 0 860 150" role="img" aria-label="Anti-tearing: geomMu, now deleted. mover.applyCenter writes ScenePolar/HasPos/ReachR; gesture.NodeKind reads only Kind from a separate nodeIdentity struct that is never written, so nothing can tear.">
      <text class="d-tl" x="0" y="12">1 · ANTI-TEARING — geomMu, now deleted</text>
      <rect class="d-group" x="0" y="22" width="860" height="120" rx="6"/>

      <rect class="d-box-flow" x="18" y="40" width="176" height="28" rx="4"/>
      <text class="d-ts" x="30" y="59">mover: applyCenter()</text>
      <line class="d-arrow-sig" x1="196" y1="54" x2="316" y2="54"/>
      <path class="d-arrow-sig" d="M308 50 L318 54 L308 58"/>
      <text class="d-ts" x="206" y="47">writes every move</text>
      <rect class="d-box-sig" x="320" y="40" width="200" height="28" rx="4"/>
      <text class="d-ts" x="332" y="59">ScenePolar · HasPos · ReachR</text>

      <rect class="d-box" x="18" y="86" width="176" height="28" rx="4"/>
      <text class="d-ts" x="30" y="105">gesture: NodeKind()</text>
      <line class="d-arrow-flow" x1="196" y1="100" x2="316" y2="100"/>
      <path class="d-arrow-flow" d="M308 96 L318 100 L308 104"/>
      <text class="d-ts" x="210" y="93">reads only Kind</text>
      <rect class="d-box" x="320" y="86" width="200" height="28" rx="4"/>
      <text class="d-ts" x="332" y="105">nodeIdentity — never written</text>

      <text class="d-ts" x="548" y="59">two different structs now,</text>
      <text class="d-ts" x="548" y="76">so nothing can tear —</text>
      <text class="d-ts" x="548" y="93">live position reaches other</text>
      <text class="d-ts" x="548" y="110">goroutines via snap atomic.Pointer</text>
    </svg>
    <p class="plate-cap">verified by removing each guard and running go test -race</p>
  </div>
