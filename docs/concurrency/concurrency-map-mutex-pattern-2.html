<section class="panel" id="p-mutex-2" data-active>

  <div class="plate">
    <svg viewBox="0 166 860 170" role="img" aria-label="Queues: outbox.mu plus cond deleted, now per-direction channels; PacedWire.mu deleted, now ownership. X.sendMove is a non-blocking send into M.neighborIn[X]; source Out.PlaceDrivenAt to PacedWire.Send and dest In.PollRecv from PacedWire.Recv are two channels with edgeMover.run owning inflight, nothing left to lock.">
      <text class="d-tl" x="0" y="176">2 · QUEUES — outbox.mu + cond deleted, now per-direction channels; PacedWire.mu deleted, now ownership</text>
      <rect class="d-group" x="0" y="186" width="860" height="140" rx="6"/>

      <rect class="d-box-flow" x="18" y="204" width="150" height="28" rx="4"/>

      <line class="d-arrow-sig" x1="170" y1="218" x2="420" y2="218"/>
      <path class="d-arrow-sig" d="M412 214 L422 218 L412 222"/>
      <text class="d-ts" x="200" y="211">non-blocking send</text>
      <rect class="d-box-flow" x="424" y="204" width="150" height="28" rx="4"/>
      <text class="d-ts" x="436" y="223">M.neighborIn[X]</text>
      <text class="d-ts" x="590" y="223">full chan → X.pending, retried next cycle — no lock</text>

      <rect class="d-box-flow" x="18" y="256" width="150" height="28" rx="4"/>
      <text class="d-ts" x="30" y="275">source: Out.PlaceDrivenAt</text>

      <rect class="d-box-flow" x="424" y="256" width="150" height="28" rx="4"/>
      <text class="d-ts" x="436" y="275">dest: In.PollRecv</text>
      <rect class="d-box-flow" x="424" y="290" width="150" height="24" rx="4"/>
      <text class="d-ts" x="436" y="307">→ PacedWire.Recv (chan)</text>
      <rect class="d-box-passive" x="200" y="266" width="190" height="36" rx="4"/>
      <text class="d-ts" x="212" y="282">edgeMover.run OWNS</text>

      <line class="d-arrow-flow" x1="392" y1="284" x2="420" y2="284"/>
      <text class="d-ts" x="590" y="284">two channels, one owning goroutine — nothing left to lock</text>
