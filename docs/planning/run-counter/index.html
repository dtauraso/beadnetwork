<h2>Data structure 2: the UI</h2>
<h3>A run</h3>

ircle cx="276.0" cy="210" r="4" style="fill: var(--link)"/><text class="mono" x="276" y="202" text-anchor="middle">2/2</text><path d="M158,218 L158,224 L276,224 L276,218" style="fill:none; stroke: var(--link)"/><text class="small" x="217" y="238" text-anchor="middle">step 1.1 playing</text><circle cx="349.0" cy="210" r="4" style="fill: var(--link)"/><text class="mono" x="349" y="202" text-anchor="middle">1/2</text><circle cx="416.0" cy="210" r="4" style="fill: var(--link)"/><text class="mono" x="416" y="202" text-anchor="middle">2/2</text><path d="M298,218 L298,224 L416,224 L416,218" style="fill:none; stroke: var(--link)"/><text class="small" x="357" y="238" text-anchor="middle">step 1.2 playing</text><circle cx="489.0" cy="210" r="4" style="fill: var(--link)"/><text class="mono" x="489" y="202" text-anchor="middle">1/2</text><circle cx="556.0" cy="210" r="4" style="fill: var(--link)"/><text class="mono" x="556" y="202" text-anchor="middle">2/2</text><path d="M438,218 L438,224 L556,224 L556,218" style="fill:none; stroke: var(--link)"/><text class="small" x="497" y="238" text-anchor="middle">step 2.1 playing</text></svg><figcaption>A run plays each step: the counter moves on when the step has played its ×N ticks. One ×N for every step. The speed slider sets how long a tick is.</figcaption></figure>
