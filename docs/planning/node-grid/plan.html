<style>

  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }

  nav { display:flex; flex-wrap:wrap; gap:2px; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); font:inherit; padding:6px 12px; cursor:pointer; }
  nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--mark); }
  main { max-width:920px; margin:0 auto; padding:20px 16px 60px; }
  section { display:none; } section.on { display:block; }
  p { margin:0 0 10px; color:var(--body); }
  svg { width:100%; height:auto; display:block; margin:0 0 18px; }
  svg text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  svg .t { fill:var(--ink); font-size:13px; } svg .d { fill:var(--dim); font-size:12px; } svg .h { fill:var(--ink); font-size:14px; font-weight:600; }
  svg .m { font-family:"SF Mono",Menlo,monospace; font-size:11px; fill:var(--body); }
  svg .box { fill:var(--panel); stroke:var(--line); } svg .grid { fill:#1c2433; stroke:#5b7bb5; } svg .read { fill:#1f2a22; stroke:#5f9a6c; }
  svg .old { fill:#2a1f22; stroke:#9a5f66; } svg .q { fill:#2a2618; stroke:#b59a4f; }
  svg .a { stroke:var(--mark); stroke-width:1.6; fill:none; marker-end:url(#ar); } svg .ar { fill:var(--mark); }
  svg .w { stroke:#e0b45b; stroke-width:1.8; fill:none; marker-end:url(#aw); } svg .aw { fill:#e0b45b; }
  svg .x { stroke:#9a5f66; stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
  svg .band { fill:var(--soft); } svg .cell { fill:var(--bg); stroke:var(--soft); } svg .ref { fill:#1c2433; stroke:#5b7bb5; }
  .key { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--dim); margin:0 0 14px; }
  .key i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px; border:1px solid; }
</style>
</head>

<script>
  const tabs = document.querySelectorAll('nav button');
  function show(id) {
    tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === id)));
    document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id));
    try { localStorage.setItem('node-grid-tab', id); } catch (e) {}
  }
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.t)));
  try { const t = localStorage.getItem('node-grid-tab'); if (t && document.getElementById(t)) show(t); } catch (e) {}
</script>
