<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a9aa6"/></marker>
  </defs>
  <rect width="780" height="400" rx="10" fill="#1e1e24"/>
  <text x="24" y="30" fill="#e7e7ea" font-size="14" font-weight="600">Every step action is a folder action</text>

  <g font-size="12" fill="#e7e7ea" font-weight="600">
    <text x="24" y="84">add / duplicate</text>
    <text x="24" y="168">delete</text>
    <text x="24" y="252">move</text>
    <text x="24" y="336">name</text>
  </g>

  <!-- row 1: add after 1 -->
  <g font-family="SF Mono,Menlo,monospace" font-size="12">
    <rect x="140" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="153" y="84" fill="#e7e7ea">1</text>
    <rect x="180" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="193" y="84" fill="#e7e7ea">2</text>
    <rect x="220" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="233" y="84" fill="#e7e7ea">3</text>
    <path d="M268 79 H306" stroke="#9a9aa6" marker-end="url(#a)"/>
    <rect x="318" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="331" y="84" fill="#e7e7ea">1</text>
    <rect x="358" y="64" width="34" height="30" rx="5" fill="#4ea1ff"/><text x="371" y="84" fill="#04101f">2</text>
    <rect x="398" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="411" y="84" fill="#e7e7ea">3</text>
    <rect x="438" y="64" width="34" height="30" rx="5" fill="#34343d"/><text x="451" y="84" fill="#e7e7ea">4</text>
    <text x="350" y="110" fill="#4ea1ff" font-size="10">copy of 1</text>
    <text x="412" y="124" fill="#9a9aa6" font-size="10">were 2, 3</text>
    <text x="500" y="76" fill="#9a9aa6" font-size="11">mv 3 4 ; mv 2 3</text>
    <text x="500" y="92" fill="#9a9aa6" font-size="11">cp -r 1 2</text>
  </g>

  <!-- row 2: delete 2 -->
  <g font-family="SF Mono,Menlo,monospace" font-size="12">
    <rect x="140" y="148" width="34" height="30" rx="5" fill="#34343d"/><text x="153" y="168" fill="#e7e7ea">1</text>
    <rect x="180" y="148" width="34" height="30" rx="5" fill="#34343d" stroke="#ff6b6b"/><text x="193" y="168" fill="#ff6b6b">2</text>
    <path d="M182 150 L212 176" stroke="#ff6b6b"/>
    <rect x="220" y="148" width="34" height="30" rx="5" fill="#34343d"/><text x="233" y="168" fill="#e7e7ea">3</text>
    <path d="M268 163 H306" stroke="#9a9aa6" marker-end="url(#a)"/>
    <rect x="318" y="148" width="34" height="30" rx="5" fill="#34343d"/><text x="331" y="168" fill="#e7e7ea">1</text>
    <rect x="358" y="148" width="34" height="30" rx="5" fill="#34343d"/><text x="371" y="168" fill="#e7e7ea">2</text>
    <text x="362" y="194" fill="#9a9aa6" font-size="10">was 3</text>
    <text x="500" y="160" fill="#9a9aa6" font-size="11">rm -r 2</text>
    <text x="500" y="176" fill="#9a9aa6" font-size="11">mv 3 2</text>
  </g>

  <!-- row 3: move 3 to front -->
  <g font-family="SF Mono,Menlo,monospace" font-size="12">
    <rect x="140" y="232" width="34" height="30" rx="5" fill="#34343d"/><text x="153" y="252" fill="#e7e7ea">1</text>
    <rect x="180" y="232" width="34" height="30" rx="5" fill="#34343d"/><text x="193" y="252" fill="#e7e7ea">2</text>
    <rect x="220" y="232" width="34" height="30" rx="5" fill="#f0a050"/><text x="233" y="252" fill="#04101f">3</text>
    <path d="M237 230 C237 214 157 214 157 228" fill="none" stroke="#f0a050" marker-end="url(#a)"/>
    <path d="M268 247 H306" stroke="#9a9aa6" marker-end="url(#a)"/>
    <rect x="318" y="232" width="34" height="30" rx="5" fill="#f0a050"/><text x="331" y="252" fill="#04101f">1</text>
    <rect x="358" y="232" width="34" height="30" rx="5" fill="#34343d"/><text x="371" y="252" fill="#e7e7ea">2</text>
    <rect x="398" y="232" width="34" height="30" rx="5" fill="#34343d"/><text x="411" y="252" fill="#e7e7ea">3</text>
    <text x="320" y="278" fill="#f0a050" font-size="10">was 3</text>
    <text x="500" y="244" fill="#9a9aa6" font-size="11">renames, in order</text>
    <text x="500" y="260" fill="#9a9aa6" font-size="11">(drag in the Links tab)</text>
  </g>

  <!-- row 4: name -->
  <g font-family="SF Mono,Menlo,monospace" font-size="12">
    <rect x="140" y="316" width="34" height="30" rx="5" fill="#34343d"/><text x="153" y="336" fill="#e7e7ea">1</text>
    <path d="M188 331 H226" stroke="#9a9aa6" marker-end="url(#a)"/>
    <rect x="238" y="316" width="110" height="30" rx="5" fill="#34343d"/><text x="248" y="336" fill="#e7e7ea">1 · lift 3</text>
    <text x="500" y="336" fill="#9a9aa6" font-size="11">1/name.bin</text>
  </g>

  <text x="24" y="382" fill="#9a9aa6" font-size="11">all paths are under sequences/8/steps/ — so Finder or a terminal can do the same while the editor is closed</text>
</svg>
