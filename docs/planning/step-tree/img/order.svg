<svg xmlns="http://www.w3.org/2000/svg" width="780" height="200" viewBox="0 0 780 200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a9aa6"/></marker>
  </defs>
  <rect width="780" height="200" rx="10" fill="#1e1e24"/>
  <text x="24" y="30" fill="#e7e7ea" font-size="14" font-weight="600">Order: each change on its own, checked in the editor</text>

  <g>
    <rect x="24" y="52" width="164" height="120" rx="8" fill="#2f2f37" stroke="#4ea1ff"/>
    <text x="38" y="76" fill="#4ea1ff" font-weight="600">1 · move paths</text>
    <text x="38" y="98" fill="#e7e7ea" font-size="11">migrate script +</text>
    <text x="38" y="114" fill="#e7e7ea" font-size="11">5 Builder files</text>
    <text x="38" y="144" fill="#9a9aa6" font-size="11">check: nothing on</text>
    <text x="38" y="158" fill="#9a9aa6" font-size="11">screen changes</text>

    <path d="M192 112 H210" stroke="#9a9aa6" marker-end="url(#a)"/>

    <rect x="214" y="52" width="164" height="120" rx="8" fill="#2f2f37" stroke="#3a3a44"/>
    <text x="228" y="76" fill="#e7e7ea" font-weight="600">2 · one pick store</text>
    <text x="228" y="98" fill="#e7e7ea" font-size="11">drop picks/,</text>
    <text x="228" y="114" fill="#e7e7ea" font-size="11">read picked.bin</text>
    <text x="228" y="144" fill="#9a9aa6" font-size="11">check: ● / ○ same</text>
    <text x="228" y="158" fill="#9a9aa6" font-size="11">as before</text>

    <path d="M382 112 H400" stroke="#9a9aa6" marker-end="url(#a)"/>

    <rect x="404" y="52" width="164" height="120" rx="8" fill="#2f2f37" stroke="#3a3a44"/>
    <text x="418" y="76" fill="#e7e7ea" font-weight="600">3 · steps from disk</text>
    <text x="418" y="98" fill="#e7e7ea" font-size="11">delete StepNumbers</text>
    <text x="418" y="144" fill="#9a9aa6" font-size="11">check: mkdir steps/3</text>
    <text x="418" y="158" fill="#9a9aa6" font-size="11">shows a step 3</text>

    <path d="M572 112 H590" stroke="#9a9aa6" marker-end="url(#a)"/>

    <rect x="594" y="52" width="164" height="120" rx="8" fill="none" stroke="#9a9aa6" stroke-dasharray="5 4"/>
    <text x="608" y="76" fill="#e7e7ea" font-weight="600">4 · + ⧉ × buttons</text>
    <text x="608" y="98" fill="#e7e7ea" font-size="11">breadcrumb, drag</text>
    <text x="608" y="114" fill="#e7e7ea" font-size="11">to reorder</text>
    <text x="608" y="144" fill="#9a9aa6" font-size="11">optional — only if</text>
    <text x="608" y="158" fill="#9a9aa6" font-size="11">you want it</text>
  </g>
</svg>
