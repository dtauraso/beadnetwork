<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11">
  <rect width="780" height="520" rx="10" fill="#15151a"/>

  <!-- panel -->
  <rect x="24" y="24" width="430" height="472" rx="8" fill="#2f2f37" stroke="#3a3a44"/>

  <!-- pills -->
  <g font-weight="600">
    <rect x="34" y="34" width="56" height="22" rx="6" fill="#34343d"/><text x="46" y="49" fill="#e7e7ea">Frame</text>
    <rect x="96" y="34" width="56" height="22" rx="6" fill="#34343d"/><text x="107" y="49" fill="#e7e7ea">Nodes</text>
    <rect x="158" y="34" width="50" height="22" rx="6" fill="#4ea1ff"/><text x="170" y="49" fill="#04101f">Links</text>
    <rect x="214" y="34" width="52" height="22" rx="6" fill="#34343d"/><text x="226" y="49" fill="#e7e7ea">Place</text>
    <rect x="272" y="34" width="46" height="22" rx="6" fill="#34343d"/><text x="284" y="49" fill="#e7e7ea">Tree</text>
  </g>

  <!-- breadcrumb -->
  <rect x="34" y="66" width="410" height="24" rx="4" fill="#34343d"/>
  <text x="44" y="82" fill="#9a9aa6">sequence 8  <tspan fill="#9a9aa6">›</tspan>  <tspan fill="#e7e7ea">step 1 · lift 3</tspan>  ›  <tspan fill="#4ea1ff" font-weight="600">2→3</tspan></text>

  <!-- network row -->
  <text x="40" y="114" fill="#5cc98b" font-weight="600">▸  network</text>
  <text x="104" y="114" fill="#9a9aa6">what runs now · folds like a step</text>

  <!-- step 1 -->
  <rect x="34" y="124" width="410" height="24" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="40" y="140" fill="#e7e7ea" font-weight="600">▾  step 1</text>
  <text x="104" y="140" fill="#9a9aa6">lift 3</text>
  <g>
    <rect x="356" y="128" width="20" height="16" rx="4" fill="#34343d"/><text x="362" y="140" fill="#e7e7ea">+</text>
    <rect x="380" y="128" width="20" height="16" rx="4" fill="#34343d"/><text x="385" y="140" fill="#e7e7ea">⧉</text>
    <rect x="404" y="128" width="20" height="16" rx="4" fill="#34343d"/><text x="410" y="140" fill="#ff6b6b">×</text>
  </g>

  <!-- head row -->
  <text x="60" y="166" fill="#9a9aa6" font-size="9.5" letter-spacing="0.05em">HEAD</text>
  <g font-family="SF Mono,Menlo,monospace">
    <rect x="110" y="155" width="44" height="18" rx="4" fill="#4ea1ff"/><text x="118" y="168" fill="#04101f">φ ↑</text>
    <rect x="160" y="155" width="44" height="18" rx="4" fill="#34343d"/><text x="168" y="168" fill="#e7e7ea">θ ·</text>
    <rect x="210" y="155" width="44" height="18" rx="4" fill="#34343d"/><text x="218" y="168" fill="#e7e7ea">r ·</text>
  </g>

  <text x="60" y="194" fill="#e7e7ea">▸  node 2</text>
  <text x="60" y="218" fill="#e7e7ea">▾  node 3</text>

  <!-- selected link -->
  <rect x="74" y="228" width="370" height="24" rx="4" fill="rgba(78,161,255,0.15)" stroke="#4ea1ff" stroke-opacity="0.6"/>
  <circle cx="90" cy="240" r="4" fill="#4ea1ff"/>
  <text x="102" y="244" fill="#e7e7ea" font-weight="600">2→3</text>
  <text x="140" y="244" fill="#9a9aa6">θ 0 + 12 → tick 12</text>

  <!-- card -->
  <rect x="88" y="260" width="342" height="104" rx="6" fill="#34343d"/>
  <g font-size="9.5" fill="#9a9aa6" letter-spacing="0.05em">
    <text x="140" y="278">START</text><text x="210" y="278">Δ</text><text x="270" y="278">nΔ</text><text x="330" y="278">1</text>
  </g>
  <g font-family="SF Mono,Menlo,monospace" fill="#e7e7ea">
    <text x="100" y="300" fill="#9a9aa6">φ</text><text x="140" y="300">1</text><text x="210" y="300">2</text><text x="270" y="300">1</text><text x="330" y="300">0</text>
    <rect x="132" y="308" width="56" height="20" rx="4" fill="#2f2f37" stroke="#4ea1ff"/>
    <text x="100" y="322" fill="#9a9aa6">θ</text><text x="140" y="322">0</text><text x="210" y="322">12</text><text x="270" y="322">1</text><text x="330" y="322">0</text>
    <text x="100" y="344" fill="#9a9aa6">r</text><text x="140" y="344">2</text><text x="210" y="344">0</text><text x="270" y="344">1</text><text x="330" y="344">0</text>
  </g>

  <text x="94" y="384" fill="#9a9aa6">○  2→1</text>

  <!-- step 2 -->
  <rect x="34" y="396" width="410" height="24" rx="4" fill="rgba(255,255,255,0.05)"/>
  <text x="40" y="412" fill="#e7e7ea" font-weight="600">▸  step 2</text>
  <text x="104" y="412" fill="#9a9aa6">drop 3</text>
  <g>
    <rect x="356" y="400" width="20" height="16" rx="4" fill="#34343d"/><text x="362" y="412" fill="#e7e7ea">+</text>
    <rect x="380" y="400" width="20" height="16" rx="4" fill="#34343d"/><text x="385" y="412" fill="#e7e7ea">⧉</text>
    <rect x="404" y="400" width="20" height="16" rx="4" fill="#34343d"/><text x="410" y="412" fill="#ff6b6b">×</text>
  </g>

  <text x="40" y="446" fill="#4ea1ff">+  add step</text>
  <text x="40" y="476" fill="#9a9aa6" font-size="10">drag a step row to reorder</text>

  <!-- annotations -->
  <g font-size="11.5" fill="#e7e7ea">
    <path d="M444 78 H500" stroke="#9a9aa6"/>
    <text x="508" y="74" font-weight="600">breadcrumb</text>
    <text x="508" y="90" fill="#9a9aa6">which copy of 2→3 you're editing:</text>
    <text x="508" y="104" fill="#9a9aa6">network, step 1 or step 2</text>

    <path d="M424 136 H500" stroke="#9a9aa6"/>
    <text x="508" y="132" font-weight="600">+  ⧉  ×</text>
    <text x="508" y="148" fill="#9a9aa6">add after · duplicate · delete</text>
    <text x="508" y="162" fill="#9a9aa6">= cp -r / rm -r on steps/N</text>

    <path d="M444 240 H500" stroke="#9a9aa6"/>
    <text x="508" y="236" font-weight="600">● picked  ○ not picked</text>
    <text x="508" y="252" fill="#9a9aa6">one picked.bin per link, nothing else</text>

    <path d="M430 318 H500" stroke="#9a9aa6"/>
    <text x="508" y="314" font-weight="600">the step's own card</text>
    <text x="508" y="330" fill="#9a9aa6">exactly what the network gets</text>
    <text x="508" y="344" fill="#9a9aa6">on a press; start in plain ticks</text>
    <text x="508" y="358" fill="#9a9aa6">so θ 0 + 12 reads as tick 12</text>
  </g>
</svg>
