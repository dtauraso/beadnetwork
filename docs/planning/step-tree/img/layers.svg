<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">
  <rect width="780" height="300" rx="10" fill="#1e1e24"/>
  <text x="24" y="30" fill="#e7e7ea" font-size="14" font-weight="600">Open question: does a step copy every link, or only the ones it changes?</text>

  <!-- full copy -->
  <text x="40" y="66" fill="#e7e7ea" font-weight="600">Full copy  <tspan fill="#9a9aa6" font-weight="400">(today)</tspan></text>
  <g font-size="11">
    <text x="130" y="92" fill="#9a9aa6">2→1</text><text x="230" y="92" fill="#9a9aa6">2→3</text>
    <text x="40" y="124" fill="#5cc98b">network</text>
    <text x="40" y="168" fill="#4ea1ff">step 1</text>
    <text x="40" y="212" fill="#f0a050">step 2</text>
  </g>
  <g>
    <rect x="110" y="104" width="80" height="32" rx="5" fill="#34343d" stroke="#5cc98b"/>
    <rect x="210" y="104" width="80" height="32" rx="5" fill="#34343d" stroke="#5cc98b"/>
    <rect x="110" y="148" width="80" height="32" rx="5" fill="#34343d" stroke="#4ea1ff"/>
    <rect x="210" y="148" width="80" height="32" rx="5" fill="#34343d" stroke="#4ea1ff"/>
    <rect x="110" y="192" width="80" height="32" rx="5" fill="#34343d" stroke="#f0a050"/>
    <rect x="210" y="192" width="80" height="32" rx="5" fill="#34343d" stroke="#f0a050"/>
  </g>
  <g font-size="11" fill="#e7e7ea" font-family="SF Mono,Menlo,monospace">
    <text x="122" y="124">θ 0+0</text><text x="222" y="124">θ 0+12</text>
    <text x="122" y="168">θ 0+0</text><text x="222" y="168">θ 0+12</text>
    <text x="122" y="212">θ 0+0</text><text x="222" y="212">θ 0+0</text>
  </g>
  <text x="40" y="256" fill="#9a9aa6" font-size="11">every step stands alone; a later edit to</text>
  <text x="40" y="272" fill="#9a9aa6" font-size="11">the network never changes a step</text>

  <line x1="390" y1="56" x2="390" y2="280" stroke="#3a3a44"/>

  <!-- sparse -->
  <text x="420" y="66" fill="#e7e7ea" font-weight="600">Only what changes</text>
  <g font-size="11">
    <text x="510" y="92" fill="#9a9aa6">2→1</text><text x="610" y="92" fill="#9a9aa6">2→3</text>
    <text x="420" y="124" fill="#5cc98b">network</text>
    <text x="420" y="168" fill="#4ea1ff">step 1</text>
    <text x="420" y="212" fill="#f0a050">step 2</text>
  </g>
  <rect x="490" y="104" width="80" height="32" rx="5" fill="#34343d" stroke="#5cc98b"/>
  <rect x="590" y="104" width="80" height="32" rx="5" fill="#34343d" stroke="#5cc98b"/>
  <rect x="490" y="148" width="80" height="32" rx="5" fill="none" stroke="#3a3a44" stroke-dasharray="4 3"/>
  <rect x="590" y="148" width="80" height="32" rx="5" fill="none" stroke="#3a3a44" stroke-dasharray="4 3"/>
  <rect x="490" y="192" width="80" height="32" rx="5" fill="none" stroke="#3a3a44" stroke-dasharray="4 3"/>
  <rect x="590" y="192" width="80" height="32" rx="5" fill="#34343d" stroke="#f0a050"/>
  <g font-size="11" fill="#e7e7ea" font-family="SF Mono,Menlo,monospace">
    <text x="502" y="124">θ 0+0</text><text x="602" y="124">θ 0+12</text>
    <text x="602" y="212">θ 0+0</text>
  </g>
  <g fill="#9a9aa6" font-size="14">
    <text x="524" y="170">↑</text><text x="624" y="170">↑</text><text x="524" y="214">↑</text>
  </g>
  <text x="420" y="256" fill="#9a9aa6" font-size="11">empty = uses the network; smaller, but a network</text>
  <text x="420" y="272" fill="#9a9aa6" font-size="11">edit shows up in every step that didn't override it</text>
</svg>
