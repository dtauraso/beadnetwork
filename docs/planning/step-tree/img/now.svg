  <!-- red callout -->
  <path d="M240 130 H300" stroke="#ff6b6b" stroke-width="1.5"/>
  <rect x="300" y="112" width="200" height="38" rx="6" fill="#2f2f37" stroke="#ff6b6b"/>
  <text x="312" y="128" fill="#ff6b6b" font-weight="600">these are NODE ids</text>
  <text x="312" y="143" fill="#9a9aa6" font-size="11">same folder, opposite meaning</text>

