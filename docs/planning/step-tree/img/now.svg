  <g fill="none" stroke="#4ea1ff" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M240 196 C360 196 380 230 486 230"/>
    <path d="M240 262 C360 262 380 266 486 266"/>
    <path d="M240 306 C360 306 380 302 486 302"/>
