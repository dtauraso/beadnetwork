<!DOCTYPE html>
<meta charset="utf-8">
<title>two circles, two polar vectors</title>
<style>
  body {
    margin: 0;
    background: #14161a;
    color: #c9d1d9;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { color: #8b949e; }
  canvas { background: #0d1013; border-radius: 6px; }
  .scenes { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .panel { display: grid; grid-template-columns: auto 190px 6ch; gap: 8px 12px; align-items: center; }
  .panel label { justify-self: end; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .a { background: #6ea8fe; }
  .b { background: #f0a868; }
  input[type=range] { width: 100%; }
  .val { color: #8b949e; text-align: right; }
  button { font: inherit; background: #22262c; color: inherit; border: 1px solid #3a4048; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
</style>

<div class="scenes" id="scenes"></div>

<script>
  // Circle B's CENTRE lies on circle A's surface, so |AB| = RA exactly — that
  // holds whether or not the radii match. Each vector starts pointing at the
  // other centre: A's base angle is 0 (towards B), B's is PI (back towards A).
  // Each scene owns its OWN set of three sliders; the scenes are independent.
  const SCENES = [
    { id: 'unequal', ra: 130, rb: 78,  caption: 'different radii — 130 / 78' },
    { id: 'equal',   ra: 105, rb: 105, caption: 'same radius — 105 / 105' },
  ];

  const rad = deg => deg * Math.PI / 180;

  function arrow(ctx, cx, cy, len, angle, color) {
    const tx = cx + len * Math.cos(angle);
    const ty = cy + len * Math.sin(angle);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    const head = 11;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - head * Math.cos(angle - 0.4), ty - head * Math.sin(angle - 0.4));
    ctx.lineTo(tx - head * Math.cos(angle + 0.4), ty - head * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function circle(ctx, cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // The lens where the two circles overlap — the only region BOTH vectors can
  // reach, so it gets its own colour to be told apart from either circle alone.
  // d = |AB| = ra by construction; the standard two-circle intersection gives
  // the chord offset `a` from A's centre and the half-chord height `h`.
  function lens(ctx, AX, AY, ra, BX, BY, rb) {
    const d = BX - AX;
    if (d >= ra + rb || d <= Math.abs(ra - rb)) return;

    const a = (d * d - rb * rb + ra * ra) / (2 * d);
    const h = Math.sqrt(ra * ra - a * a);
    const alpha = Math.atan2(h, a);        // A-centre angle to the upper crossing
    const beta = Math.atan2(h, a - d);     // B-centre angle to the same point

    ctx.beginPath();
    ctx.arc(AX, AY, ra, -alpha, alpha, false);  // right cap, on A
    ctx.arc(BX, BY, rb, beta, -beta, false);    // left cap, on B
    ctx.closePath();
    ctx.fillStyle = 'rgba(122, 224, 168, 0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(122, 224, 168, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Sweep from the baseline direction to where the vector now points, plus the
  // signed degree reading. Canvas y grows downward, so a POSITIVE degree step
  // sweeps clockwise on screen.
  function angleMark(ctx, cx, cy, base, deg, r, color) {
    const to = base + rad(deg);
    if (Math.abs(deg) > 0.5) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, base, to, deg < 0);
      ctx.stroke();
    }
    const sense = deg === 0 ? '' : (deg > 0 ? ' cw' : ' ccw');
    const text = `${deg > 0 ? '+' : ''}${deg}°${sense}`;

    // Sit the label on the bisector of the swept arc. At a small sweep that
    // bisector lies ON the arrow, so push the label clear along the arc's
    // perpendicular — otherwise the two overlap and neither reads.
    const mid = base + rad(deg) / 2;
    let lx = cx + (r + 18) * Math.cos(mid);
    let ly = cy + (r + 18) * Math.sin(mid);
    if (Math.abs(deg) < 25) {
      const perp = mid + Math.PI / 2 * (deg < 0 ? 1 : -1);
      lx += 20 * Math.cos(perp);
      ly += 20 * Math.sin(perp);
    }

    ctx.font = '600 14px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Plate behind the text so it stays readable over circles, arrows and the
    // dashed baseline.
    const w = ctx.measureText(text).width + 12;
    const h = 20;
    ctx.fillStyle = 'rgba(13, 16, 19, 0.92)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(lx - w / 2, ly - h / 2, w, h, 5);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.fillText(text, lx, ly);
  }

  function slider(id, labelHTML) {
    return `
      <label for="${id}">${labelHTML}</label>
      <input type="range" id="${id}" min="-180" max="180" step="1" value="0">
      <span class="val" id="${id}-v">0°</span>`;
  }

  function build(scene) {
    const fig = document.createElement('figure');
    fig.innerHTML = `
      <canvas id="c-${scene.id}" width="460" height="380"></canvas>
      <figcaption>${scene.caption}</figcaption>
      <div class="panel">
        ${slider(`${scene.id}-joint`, 'both')}
        ${slider(`${scene.id}-a`, '<span class="swatch a"></span>vector A')}
        ${slider(`${scene.id}-b`, '<span class="swatch b"></span>vector B')}
        <span></span><span><button id="${scene.id}-reset">reset</button></span><span></span>
      </div>`;
    document.getElementById('scenes').appendChild(fig);

    const ids = [`${scene.id}-joint`, `${scene.id}-a`, `${scene.id}-b`];
    for (const id of ids) {
      document.getElementById(id).addEventListener('input', () => draw(scene));
    }
    document.getElementById(`${scene.id}-reset`).addEventListener('click', () => {
      for (const id of ids) document.getElementById(id).value = 0;
      draw(scene);
    });
  }

  function draw(scene) {
    const { ra, rb } = scene;
    const joint = +document.getElementById(`${scene.id}-joint`).value;
    const a = +document.getElementById(`${scene.id}-a`).value;
    const b = +document.getElementById(`${scene.id}-b`).value;

    const canvas = document.getElementById(`c-${scene.id}`);
    const ctx = canvas.getContext('2d');

    // Centre the pair: the drawing spans AX-ra .. AX+ra+rb, i.e. 2*ra + rb wide.
    const AX = (canvas.width - (2 * ra + rb)) / 2 + ra;
    const AY = canvas.height / 2;
    const BX = AX + ra, BY = AY;

    // The joint slider drives the two mirror-wise: left circle takes +joint
    // (clockwise on screen), right circle takes -joint (counter-clockwise). The
    // per-vector sliders stay literal offsets in each vector's own frame.
    const degA = joint + a;
    const degB = -joint + b;
    const angleA = rad(degA);            // base 0   — towards B
    const angleB = Math.PI + rad(degB);  // base PI  — towards A

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // centre-to-centre line, the shared baseline both vectors start on
    ctx.strokeStyle = '#2c333c';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(AX - ra, AY);
    ctx.lineTo(BX + rb, BY);
    ctx.stroke();
    ctx.setLineDash([]);

    lens(ctx, AX, AY, ra, BX, BY, rb);

    circle(ctx, AX, AY, ra, '#3d5a8c');
    circle(ctx, BX, BY, rb, '#8c6a3d');

    angleMark(ctx, AX, AY, 0, degA, ra * 0.42, '#6ea8fe');
    angleMark(ctx, BX, BY, Math.PI, degB, rb * 0.42, '#f0a868');

    arrow(ctx, AX, AY, ra, angleA, '#6ea8fe');
    arrow(ctx, BX, BY, rb, angleB, '#f0a868');

    document.getElementById(`${scene.id}-joint-v`).textContent = joint + '°';
    document.getElementById(`${scene.id}-a-v`).textContent = a + '°';
    document.getElementById(`${scene.id}-b-v`).textContent = b + '°';
  }

  for (const scene of SCENES) {
    build(scene);
    draw(scene);
  }
</script>
