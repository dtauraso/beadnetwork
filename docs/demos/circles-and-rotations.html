<!DOCTYPE html>
<meta charset="utf-8">
<title>circles and rotations — flat and spherical</title>
<style>
  body {
    margin: 0;
    background: #14161a;
    color: #c9d1d9;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px;
  }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  figcaption { color: #8b949e; }
  canvas { background: #0d1013; border-radius: 6px; }
  canvas.orbit { cursor: grab; touch-action: none; }
  canvas.orbit:active { cursor: grabbing; }
  .scenes { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  /* An author `display` beats the UA rule behind the `hidden` attribute, so the
     hidden tab would otherwise stay on screen. */
  .scenes[hidden] { display: none; }
  .panel { display: grid; grid-template-columns: auto 190px 6ch; gap: 8px 12px; align-items: center; }
  .panel label { justify-self: end; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .a { background: #6ea8fe; }
  .b { background: #f0a868; }
  input[type=range] { width: 100%; }
  .val { color: #8b949e; text-align: right; }
  .tabs { display: flex; gap: 6px; }
  .tabs button[aria-selected="true"] { background: #6ea8fe; border-color: #6ea8fe; color: #0d1013; }
  button { font: inherit; background: #22262c; color: inherit; border: 1px solid #3a4048; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
</style>

<div class="tabs" id="tabs"></div>
<div class="scenes" id="tab-3"></div>
<div class="scenes" id="tab-2" hidden></div>
<div class="scenes" id="tab-3s" hidden></div>
<div class="scenes" id="tab-2s" hidden></div>

<script>
  // One ORANGE circle in the middle with THREE BLUE circles at equal places
  // around it — spokes 120° apart, each blue centre ON the orange circle's
  // surface, so |orange-blue| = ro on every spoke. Each blue/orange pair carries
  // a mutual pair of vectors that start pointed at each other, so the orange
  // circle has one vector per blue neighbour (three of them).
  // Each scene owns its OWN set of three sliders; the scenes are independent.
  // Spoke count is per scene: three blue circles at 120°, or two at 180°. Each
  // spoke's blue centre still sits ON the orange circle's surface either way.
  const SPOKE_NAMES = {
    2: ['↑', '↓'],                       // spoke order: up, then clockwise
    3: ['↑', '↘', '↙'],
  };
  const EXAMPLES = [
    { id: 'unequal',   spokes: 3, ro: 58, rb: 95, caption: 'three blue — blue 95 / orange 58' },
    { id: 'equal',     spokes: 3, ro: 82, rb: 82, caption: 'three blue — same radius 82' },
    { id: 'two',       spokes: 2, ro: 58, rb: 95, caption: 'two blue — blue 95 / orange 58' },
    { id: 'two-equal', spokes: 2, ro: 82, rb: 82, caption: 'two blue — same radius 82' },
    {
      id: 'two-overlap', spokes: 2, ro: 82, rb: 82, overlapDeg: 120,
      names: ['◤', '◥'],
      caption: 'all three same radius 82 — two blue overlapping each other by ~120°',
    },
  ];

  // Every example exists twice: once as flat circles, once as spheres. Same
  // numbers, same sliders, same construction — only the renderer differs, so a
  // sphere tab can never drift from the circle tab it mirrors.
  const SCENES = EXAMPLES.flatMap(e => [
    { ...e, kind: 'flat' },
    { ...e, kind: 'sphere', id: `${e.id}-s` },
  ]);
  const names = scene => scene.names || SPOKE_NAMES[scene.spokes];
  const tabKey = scene => `${scene.spokes}${scene.kind === 'sphere' ? 's' : ''}`;

  const rad = deg => deg * Math.PI / 180;

  function arrow(ctx, cx, cy, len, angle, color) {
    const tx = cx + len * Math.cos(angle);
    const ty = cy + len * Math.sin(angle);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    const head = 11;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - head * Math.cos(angle - 0.4), ty - head * Math.sin(angle - 0.4));
    ctx.lineTo(tx - head * Math.cos(angle + 0.4), ty - head * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function circle(ctx, cx, cy, r, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // The lens where two circles overlap — the only region BOTH of that pair's
  // vectors can reach, so it gets its own colour to be told apart from either
  // circle alone. Written along the pair's own axis `psi` rather than the x
  // axis, because the blue circles sit at every spoke angle, not just left/right.
  function lens(ctx, AX, AY, ra, BX, BY, rb) {
    const dx = BX - AX, dy = BY - AY;
    const d = Math.hypot(dx, dy);
    if (d >= ra + rb || d <= Math.abs(ra - rb)) return;

    const psi = Math.atan2(dy, dx);        // A → B
    const a = (d * d - rb * rb + ra * ra) / (2 * d);
    const h = Math.sqrt(ra * ra - a * a);
    const alpha = Math.atan2(h, a);        // A-centre angle to one crossing
    const beta = Math.atan2(h, a - d);     // B-centre angle to the same point

    ctx.beginPath();
    ctx.arc(AX, AY, ra, psi - alpha, psi + alpha, false);  // cap on A, facing B
    ctx.arc(BX, BY, rb, psi + beta, psi - beta, false);    // cap on B, facing A
    ctx.closePath();
    ctx.fillStyle = 'rgba(122, 224, 168, 0.16)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(122, 224, 168, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // The swept arc from the baseline direction to where the vector now points.
  // Canvas y grows downward, so a POSITIVE degree step sweeps clockwise.
  function angleArc(ctx, cx, cy, base, deg, r, color) {
    if (Math.abs(deg) < 0.5) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, base, base + rad(deg), deg < 0);
    ctx.stroke();
  }

  // The degree readings live in the empty band ABOVE the circles, never inside
  // the drawing — a label chased around the arc always ends up on top of some
  // line at some angle, so it is parked where no line can reach it.
  function readout(ctx, x, y, align, deg, color, tag = '') {
    const sense = deg === 0 ? '' : (deg > 0 ? ' cw' : ' ccw');
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    ctx.textAlign = align;
    ctx.textBaseline = 'top';
    ctx.fillStyle = color;
    ctx.fillText(`${tag ? tag + ' ' : ''}${deg > 0 ? '+' : ''}${deg}°${sense}`, x, y);
  }

  // ===== sphere view =======================================================
  // Hand-rolled oblique projection, no library: yaw about the vertical, then
  // pitch, then a perspective divide. The layout still lives in the z = 0
  // plane, so every angle a slider sets means the same thing it means in the
  // flat view — the tilt is only how it is looked at.
  // The live view. Each sphere scene owns its own yaw/pitch (drag to orbit) and
  // stamps them here before drawing — rendering is synchronous, so one module
  // level view is enough and nothing has to thread a camera through every call.
  const VIEW = { yaw: -0.45, pitch: 0.95, f: 1000 };
  const startView = () => ({ yaw: -0.45, pitch: 0.95 });

  function project(v, cx, cy) {
    const cy1 = Math.cos(VIEW.yaw), sy1 = Math.sin(VIEW.yaw);
    const x1 = v.x * cy1 + v.z * sy1;
    const z1 = -v.x * sy1 + v.z * cy1;
    const cp = Math.cos(VIEW.pitch), sp = Math.sin(VIEW.pitch);
    const y2 = v.y * cp - z1 * sp;
    const z2 = v.y * sp + z1 * cp;
    const s = VIEW.f / (VIEW.f + z2);
    return { x: cx + x1 * s, y: cy + y2 * s, z: z2, s };
  }

  const polyline = (ctx, pts, cx, cy, color, width = 1.5, alpha = 1) => {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    pts.forEach((v, i) => {
      const p = project(v, cx, cy);
      i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    });
    ctx.stroke();
    ctx.restore();
  };

  // A circle of radius r in the plane through C spanned by e1, e2.
  const ring = (C, r, e1, e2, n = 72) => Array.from({ length: n + 1 }, (_, i) => {
    const t = i / n * Math.PI * 2;
    return {
      x: C.x + r * (e1.x * Math.cos(t) + e2.x * Math.sin(t)),
      y: C.y + r * (e1.y * Math.cos(t) + e2.y * Math.sin(t)),
      z: C.z + r * (e1.z * Math.cos(t) + e2.z * Math.sin(t)),
    };
  });

  const EX = { x: 1, y: 0, z: 0 }, EY = { x: 0, y: 1, z: 0 }, EZ = { x: 0, y: 0, z: 1 };

  // A sphere reads as a sphere from its silhouette plus three great circles;
  // the silhouette alone would be indistinguishable from the flat view.
  function sphere(ctx, C, r, cx, cy, color, wire) {
    const p = project(C, cx, cy);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * p.s, 0, Math.PI * 2);
    ctx.stroke();
    polyline(ctx, ring(C, r, EX, EY), cx, cy, wire, 1, 0.5);
    polyline(ctx, ring(C, r, EX, EZ), cx, cy, wire, 1, 0.5);
    polyline(ctx, ring(C, r, EY, EZ), cx, cy, wire, 1, 0.5);
  }

  // Two spheres meet in a CIRCLE, not a lens: same chord algebra as the flat
  // case, drawn in the plane perpendicular to the centre-to-centre axis.
  function meetCircle(ctx, P, r1, Q, r2, cx, cy) {
    const ux = Q.x - P.x, uy = Q.y - P.y, uz = Q.z - P.z;
    const d = Math.hypot(ux, uy, uz);
    if (d >= r1 + r2 || d <= Math.abs(r1 - r2)) return;

    const a = (d * d - r2 * r2 + r1 * r1) / (2 * d);
    const h = Math.sqrt(r1 * r1 - a * a);
    const u = { x: ux / d, y: uy / d, z: uz / d };
    const C = { x: P.x + a * u.x, y: P.y + a * u.y, z: P.z + a * u.z };

    // any two unit vectors perpendicular to u
    const seed = Math.abs(u.z) < 0.9 ? EZ : EX;
    const cross = (m, n) => ({
      x: m.y * n.z - m.z * n.y, y: m.z * n.x - m.x * n.z, z: m.x * n.y - m.y * n.x,
    });
    const norm = v => { const l = Math.hypot(v.x, v.y, v.z); return { x: v.x / l, y: v.y / l, z: v.z / l }; };
    const e1 = norm(cross(u, seed));
    const e2 = cross(u, e1);

    const pts = ring(C, h, e1, e2);
    ctx.save();
    ctx.fillStyle = 'rgba(122, 224, 168, 0.16)';
    ctx.beginPath();
    pts.forEach((v, i) => {
      const p = project(v, cx, cy);
      i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    polyline(ctx, pts, cx, cy, 'rgba(122, 224, 168, 0.75)', 1.5);
  }

  // A vector living in the layout plane, drawn in 3D with a disc for its head.
  function vector3(ctx, C, r, angle, cx, cy, color) {
    const tip = { x: C.x + r * Math.cos(angle), y: C.y + r * Math.sin(angle), z: C.z };
    const p0 = project(C, cx, cy), p1 = project(tip, cx, cy);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, 5 * p1.s, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p0.x, p0.y, 3.5 * p0.s, 0, Math.PI * 2);
    ctx.fill();
  }

  function angleArc3(ctx, C, base, deg, r, cx, cy, color) {
    if (Math.abs(deg) < 0.5) return;
    const n = 48;
    const pts = Array.from({ length: n + 1 }, (_, i) => {
      const t = base + rad(deg) * (i / n);
      return { x: C.x + r * Math.cos(t), y: C.y + r * Math.sin(t), z: C.z };
    });
    polyline(ctx, pts, cx, cy, color, 1.5);
  }

  function slider(id, labelHTML) {
    return `
      <label for="${id}">${labelHTML}</label>
      <input type="range" id="${id}" min="-180" max="180" step="1" value="0">
      <span class="val" id="${id}-v">0°</span>`;
  }

  function build(scene) {
    const fig = document.createElement('figure');
    fig.innerHTML = `
      <canvas id="c-${scene.id}" width="460" height="380"></canvas>
      <figcaption>${scene.caption}</figcaption>
      <div class="panel">
        ${slider(`${scene.id}-joint`, 'both')}
        ${slider(`${scene.id}-a`, '<span class="swatch a"></span>all blue')}
        ${names(scene).map((n, k) =>
          slider(`${scene.id}-a${k}`, `<span class="swatch a"></span>blue ${n}`)).join('')}
        ${slider(`${scene.id}-b`, '<span class="swatch b"></span>orange vectors')}
        <span></span><span><button id="${scene.id}-reset">reset</button></span><span></span>
      </div>`;
    document.getElementById(`tab-${tabKey(scene)}`).appendChild(fig);

    // Kept on the scene so draw() can refresh EVERY slider's degree readout,
    // including the per-blue ones — a slider whose number never moves reads as
    // a broken control.
    const ids = scene.sliderIds = [
      `${scene.id}-joint`,
      `${scene.id}-a`,
      ...names(scene).map((_, k) => `${scene.id}-a${k}`),
      `${scene.id}-b`,
    ];
    for (const id of ids) {
      document.getElementById(id).addEventListener('input', () => draw(scene));
    }
    document.getElementById(`${scene.id}-reset`).addEventListener('click', () => {
      for (const id of ids) document.getElementById(id).value = 0;
      if (scene.kind === 'sphere') scene.view = startView();
      draw(scene);
    });

    // Drag a sphere canvas to orbit that scene's own camera. Pitch is clamped
    // just short of straight-down so the layout plane never degenerates to a
    // line, which would make every vector unreadable at once.
    if (scene.kind === 'sphere') {
      const canvas = document.getElementById(`c-${scene.id}`);
      canvas.className = 'orbit';
      let dragging = null;
      canvas.addEventListener('pointerdown', e => {
        dragging = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture?.(e.pointerId);
      });
      canvas.addEventListener('pointermove', e => {
        if (!dragging) return;
        const view = scene.view ??= startView();
        // Signs chosen so the scene follows the hand. Pitch rotates about the
        // screen-x axis, which moves near points OPPOSITE the drag, so it takes
        // a minus; yaw already tracks the drag and does not.
        view.yaw += (e.clientX - dragging.x) * 0.008;
        view.pitch = Math.max(-1.45, Math.min(1.45, view.pitch - (e.clientY - dragging.y) * 0.008));
        dragging = { x: e.clientX, y: e.clientY };
        draw(scene);
      });
      const end = e => {
        dragging = null;
        canvas.releasePointerCapture?.(e.pointerId);
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);
    }
  }

  function draw(scene) {
    const { ro, rb } = scene;
    const joint = +document.getElementById(`${scene.id}-joint`).value;
    const a = +document.getElementById(`${scene.id}-a`).value;
    const b = +document.getElementById(`${scene.id}-b`).value;

    const canvas = document.getElementById(`c-${scene.id}`);
    const ctx = canvas.getContext('2d');
    if (scene.kind === 'sphere') Object.assign(VIEW, scene.view ??= startView());

    // Orange in the middle; the drawing reaches ro + rb in every direction.
    const BAND = 28;                            // reserved for the readouts
    const OX = canvas.width / 2;
    const OY = (canvas.height + BAND) / 2;

    // Every spoke behaves the same way, so it is one loop, not a hand-placed
    // left and right. Within a pair the two vectors COUNTER-rotate under the
    // joint slider (orange +joint, blue -joint) — the same mirror rule as
    // before, now applied per spoke rather than per side. The per-colour
    // sliders are literal offsets, applied to all instances of that colour.
    // Each blue also has its OWN slider on top of the shared one, so a single
    // blue vector can be moved without disturbing the other two.
    const degOrange = joint + b;                // orange, base = spoke — towards its blue
    // Spokes are evenly spaced by default. A scene may instead ask for a given
    // BLUE-BLUE overlap: two blue circles of radius rb whose lens subtends
    // `overlapDeg` at each blue centre have their centres |PQ| = 2*rb*cos(half)
    // apart, and both centres lie on the orange circle, so the spoke separation
    // is 2*asin(|PQ| / 2*ro). Solved here rather than hand-tuned, so the stated
    // 120° is the thing actually drawn.
    const step = scene.overlapDeg === undefined
      ? 2 * Math.PI / scene.spokes
      : 2 * Math.asin(Math.min(1, rb * Math.cos(rad(scene.overlapDeg) / 2) / ro));
    const first = -Math.PI / 2 - step * (scene.spokes - 1) / 2;   // spread about "up"

    const spokes = Array.from({ length: scene.spokes }, (_, k) => {
      const psi = scene.overlapDeg === undefined
        ? -Math.PI / 2 + k * step                 // first spoke points up
        : first + k * step;                       // symmetric about up
      const own = +document.getElementById(`${scene.id}-a${k}`).value;
      return {
        psi,
        x: OX + ro * Math.cos(psi),
        y: OY + ro * Math.sin(psi),
        own,
        degBlue: -joint + a + own,              // blue, base = spoke + PI — towards orange
      };
    });

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (scene.kind === 'sphere') {
      // Same centres, expressed in the z = 0 plane of the 3D scene.
      const O = { x: 0, y: 0, z: 0 };
      const blues = spokes.map(s => ({
        s, C: { x: ro * Math.cos(s.psi), y: ro * Math.sin(s.psi), z: 0 },
      }));

      ctx.strokeStyle = '#2c333c';
      ctx.setLineDash([4, 4]);
      for (const { s, C } of blues) {
        polyline(ctx, [O, {
          x: C.x + rb * Math.cos(s.psi), y: C.y + rb * Math.sin(s.psi), z: 0,
        }], OX, OY, '#2c333c', 1);
      }
      ctx.setLineDash([]);

      for (const { C } of blues) meetCircle(ctx, O, ro, C, rb, OX, OY);

      // far spheres first, so the near ones overlap them the right way round
      const solids = [{ C: O, r: ro, color: '#8c6a3d', wire: '#8c6a3d' },
        ...blues.map(({ C }) => ({ C, r: rb, color: '#3d5a8c', wire: '#3d5a8c' }))];
      solids.sort((p, q) => project(q.C, OX, OY).z - project(p.C, OX, OY).z);
      for (const s of solids) sphere(ctx, s.C, s.r, OX, OY, s.color, s.wire);

      for (const { s, C } of blues) {
        angleArc3(ctx, O, s.psi, degOrange, ro * 0.42, OX, OY, '#f0a868');
        angleArc3(ctx, C, s.psi + Math.PI, s.degBlue, rb * 0.42, OX, OY, '#6ea8fe');
      }
      for (const { s, C } of blues) {
        vector3(ctx, O, ro, s.psi + rad(degOrange), OX, OY, '#f0a868');
        vector3(ctx, C, rb, s.psi + Math.PI + rad(s.degBlue), OX, OY, '#6ea8fe');
      }
    } else {
      // centre-to-centre spokes, the baseline each pair's vectors start on
      ctx.strokeStyle = '#2c333c';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      for (const s of spokes) {
        ctx.beginPath();
        ctx.moveTo(OX, OY);
        ctx.lineTo(s.x + rb * Math.cos(s.psi), s.y + rb * Math.sin(s.psi));
        ctx.stroke();
      }
      ctx.setLineDash([]);

      for (const s of spokes) lens(ctx, OX, OY, ro, s.x, s.y, rb);

      circle(ctx, OX, OY, ro, '#8c6a3d');
      for (const s of spokes) circle(ctx, s.x, s.y, rb, '#3d5a8c');

      for (const s of spokes) {
        angleArc(ctx, OX, OY, s.psi, degOrange, ro * 0.42, '#f0a868');
        angleArc(ctx, s.x, s.y, s.psi + Math.PI, s.degBlue, rb * 0.42, '#6ea8fe');
      }
      for (const s of spokes) {
        arrow(ctx, OX, OY, ro, s.psi + rad(degOrange), '#f0a868');
        arrow(ctx, s.x, s.y, rb, s.psi + Math.PI + rad(s.degBlue), '#6ea8fe');
      }
    }

    // Blue readings can now differ per spoke, so all three are listed.
    ctx.font = '11px ui-monospace, SFMono-Regular, Menlo, monospace';
    spokes.forEach((s, k) => {
      readout(ctx, 10 + k * 74, 9, 'left', s.degBlue, '#6ea8fe', names(scene)[k]);
    });
    readout(ctx, canvas.width - 10, 9, 'right', degOrange, '#f0a868');

    for (const id of scene.sliderIds) {
      const deg = +document.getElementById(id).value;
      document.getElementById(`${id}-v`).textContent = (deg > 0 ? '+' : '') + deg + '°';
    }
  }

  for (const scene of SCENES) {
    build(scene);
    draw(scene);
  }

  // One tab per (spoke count × renderer) — circles first, then the spheres.
  const TABS = [
    { key: '3',  label: 'three blue circles' },
    { key: '2',  label: 'two blue circles' },
    { key: '3s', label: 'three blue spheres' },
    { key: '2s', label: 'two blue spheres' },
  ];
  const tabs = document.getElementById('tabs');
  for (const t of TABS) {
    const btn = document.createElement('button');
    btn.textContent = t.label;
    btn.setAttribute('aria-selected', String(t.key === '3'));
    btn.addEventListener('click', () => {
      for (const other of TABS) {
        document.getElementById(`tab-${other.key}`).hidden = other.key !== t.key;
      }
      for (const b of tabs.children) b.setAttribute('aria-selected', String(b === btn));
    });
    tabs.appendChild(btn);
  }
</script>
