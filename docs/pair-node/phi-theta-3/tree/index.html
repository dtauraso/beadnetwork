<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pair node — a→b tree</title>
<link rel="stylesheet" href="../../pair-base.css">
<link rel="stylesheet" href="../../pair-layout.css">
<style>
  :root {
    --bg: #fbfaf7; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2ded5; --card: #ffffff; --wire: #8c887f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --ink: #ecebe6; --muted: #a09e97; --line: #2f2e2a; --card: #1e1e1b; --wire: #77746c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161614; --ink: #ecebe6; --muted: #a09e97; --line: #2f2e2a; --card: #1e1e1b; --wire: #77746c;
  }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  svg { width: 100%; height: auto; display: block; }
  svg .edge { fill: none; stroke: var(--wire); stroke-width: 1.5; marker-end: url(#arrow); }
  svg .head { fill: var(--wire); }
  svg .box { fill: var(--card); stroke: var(--ink); stroke-width: 1.5; }
  svg text { fill: var(--ink); font-size: 15px; text-anchor: middle; dominant-baseline: central; }</style>
</head>
<body>
<header>
  <h1>The a→b tree</h1>
  <div class="sub">Editing a→b, by the pairs each part of the move uses: a→b places b; (a→b, a→c) turns c round a; b→c has its frame turned. Below each group, the nodes it uses.</div>
</header>

<nav>
  <a href="../../phi-2/index.html">Pair tabs</a>
  <a href="../index.html">Three-node card</a>
  <a href="../atob/index.html">a→b vectors</a>
  <a href="../builder/index.html">a→b builder</a>
  <a class="on" href="index.html">a→b tree</a>
</nav>

<main>
  <div class="panel">
    <svg viewBox="0 0 600 420" role="img" aria-label="Tree: root, then (a→b, a→c) and b→c, then a→b and a→c under (a→b, a→c), then a, b and c">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path class="head" d="M0 0 L10 5 L0 10 z"/>
        </marker>
      </defs>
      <path class="edge" d="M300 58 L200 132"/>
      <path class="edge" d="M300 58 L460 132"/>

      <path class="edge" d="M200 168 L110 242"/>
      <path class="edge" d="M200 168 L290 242"/>

      <path class="edge" d="M110 278 L142 362"/>
      <path class="edge" d="M110 278 L292 362"/>

      <path class="edge" d="M290 278 L158 362"/>
      <path class="edge" d="M290 278 L444 362"/>

      <path class="edge" d="M460 168 L308 362"/>
      <path class="edge" d="M460 168 L456 362"/>

      <rect class="box" x="255" y="22" width="90" height="36" rx="8"/><text x="300" y="40">root</text>

      <rect class="box" x="130" y="132" width="140" height="36" rx="8"/><text x="200" y="150">(a→b, a→c)</text>
      <rect class="box" x="415" y="132" width="90" height="36" rx="8"/><text x="460" y="150">b→c</text>

      <rect class="box" x="65" y="242" width="90" height="36" rx="8"/><text x="110" y="260">a→b</text>
      <rect class="box" x="245" y="242" width="90" height="36" rx="8"/><text x="290" y="260">a→c</text>

      <rect class="box" x="128" y="362" width="44" height="36" rx="18"/><text x="150" y="380">a</text>
      <rect class="box" x="278" y="362" width="44" height="36" rx="18"/><text x="300" y="380">b</text>
      <rect class="box" x="428" y="362" width="44" height="36" rx="18"/><text x="450" y="380">c</text>
    </svg>
  </div>
</main>
</body>
</html>
