  <main>

      <div class="grid">
        <div class="card">
          <h2>One cycle of the node's own loop</h2>
          <svg width="640" height="350" viewBox="0 0 640 350">
            <defs>
              <marker id="f1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
                <path d="M0,0 L7,3 L0,6 z" fill="#9a9aa6" />
              </marker>
            </defs>

            <rect x="16" y="20" width="130" height="46" rx="8" fill="#2b2b33" stroke="#3a3a44" />
            <text x="81" y="42" text-anchor="middle" class="lblm">poll VectorIn</text>
            <text x="81" y="58" text-anchor="middle" class="lbl">non-blocking</text>

            <path d="M 146 43 L 186 43" stroke="#9a9aa6" marker-end="url(#f1)" />

            <rect x="190" y="20" width="130" height="46" rx="8" fill="#2b2b33" stroke="#5fd68a" />
            <text x="255" y="42" text-anchor="middle" class="lblm">record arrival</text>
            <text x="255" y="58" text-anchor="middle" class="lbl">3rd vector, every arrival</text>

            <path d="M 255 66 L 255 100" stroke="#9a9aa6" marker-end="url(#f1)" />

            <rect x="180" y="104" width="150" height="52" rx="8" fill="#2b2b33" stroke="#4ea1ff" />
            <text x="255" y="126" text-anchor="middle" class="lblm">own machine's halt?</text>
            <text x="255" y="144" text-anchor="middle" class="lbl">perpendicular or parallel</text>

            <path d="M 330 130 L 380 130" stroke="#9a9aa6" marker-end="url(#f1)" />

            <rect x="384" y="104" width="120" height="52" rx="8" fill="#2b2b33" stroke="#e05fd8" />
            <text x="444" y="126" text-anchor="middle" class="lblm">step ±1</text>
            <text x="444" y="144" text-anchor="middle" class="lbl">the turn rule</text>

            <path d="M 444 156 L 444 190" stroke="#9a9aa6" marker-end="url(#f1)" />

            <rect x="360" y="194" width="170" height="52" rx="8" fill="#2b2b33" stroke="#5fd68a" />
            <text x="445" y="216" text-anchor="middle" class="lblm">sync · send · place bead</text>
            <text x="445" y="234" text-anchor="middle" class="lbl">all fire-and-forget</text>

            <path d="M 360 220 L 200 220" stroke="#9a9aa6" marker-end="url(#f1)" />
            <rect x="40" y="194" width="155" height="52" rx="8" fill="#2b2b33" stroke="#3a3a44" />
            <text x="117" y="216" text-anchor="middle" class="lblm">poll In (bead)</text>
            <text x="117" y="234" text-anchor="middle" class="lbl">marks the round trip</text>

            <path d="M 117 194 L 117 70" stroke="#9a9aa6" stroke-dasharray="4 3" marker-end="url(#f1)" />

            <rect x="16" y="272" width="600" height="42" rx="8" fill="#2b2b33" stroke="#3a3a44" />
            <text x="30" y="316" class="lbl">One step per cycle, and a cycle is one scaled tick — so the dial paces the turning.</text>
            <text x="30" y="298" class="lbl">The bead marks the round trip; the vector channel carries the
              direction.</text>
          </svg>

      </div>
